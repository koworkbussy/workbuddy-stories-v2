<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>沃克巴迪的故事 · 第2集：魔法充电</title>
<style>
:root {
  --blue: #4A90E2;
  --blue-d: #1A5AA8;
  --blue-l: #7BB5F2;
  --gold: #F5A623;
  --green: #4CD964;
  --white: #FFFFFF;
  --ink: #2C2C2A;
  --muted: #777;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  overflow: hidden;
  width: 100vw; height: 100vh;
  background: #1A1A2E;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

/* ===== 场景背景（傍晚→入夜→手机桌面） ===== */
.scene-bg {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(180deg, #2A1A3E 0%, #3D2A4E 40%, #4A3A5E 100%);
  transition: background 1.5s ease;
}

.scene-bg.dusk {
  background: linear-gradient(180deg, #4A2A5E 0%, #6A3A4E 30%, #8A4A3E 60%, #3D5A3E 100%);
}

.scene-bg.night {
  background: linear-gradient(180deg, #0F0F2E 0%, #1A1A3E 50%, #2A2A4E 100%);
}

.scene-bg.desk {
  background: linear-gradient(180deg, #F0F2F5 0%, #E4E7EC 50%, #D8DCE2 100%);
}

/* ===== 星星（入夜时） ===== */
.stars-layer {
  position: fixed; inset: 0; z-index: 1;
  opacity: 0;
  transition: opacity 1s;
  pointer-events: none;
}
.stars-layer.show { opacity: 1; }

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle var(--dur) ease-in-out infinite;
  animation-delay: var(--delay);
}
@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.4); }
}

/* ===== 草地 ===== */
.ground-layer {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 2;
  height: 28vh;
  background: linear-gradient(0deg, #1A3A1A 0%, #2A5A2A 50%, #3A7A3A 80%, transparent 100%);
  opacity: 1;
  transition: opacity 1s;
}
.ground-layer.hide { opacity: 0; }

.grass-top {
  position: absolute; top: -10px; left: 0; right: 0;
  height: 18px;
  background: repeating-linear-gradient(
    90deg,
    transparent 0px, transparent 8px,
    #4A8A3A 8px, #4A8A3A 13px
  );
  clip-path: polygon(
    0% 100%, 4% 40%, 8% 100%, 12% 30%, 16% 100%,
    20% 45%, 24% 100%, 28% 25%, 32% 100%, 36% 50%,
    40% 100%, 44% 35%, 48% 100%, 52% 20%, 56% 100%,
    60% 48%, 64% 100%, 68% 28%, 72% 100%, 76% 55%,
    80% 100%, 84% 38%, 88% 100%, 92% 32%, 96% 100%,
    100% 42%, 100% 100%
  );
}

/* ===== 巴迪角色 ===== */
.badi {
  position: fixed;
  z-index: 20;
  left: 50%;
  transform: translateX(-50%);
  bottom: 18vh;
  transition: all 0.8s cubic-bezier(.34,1.56,.64,1);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.badi svg { width: 130px; height: 170px; filter: drop-shadow(0 8px 16px rgba(0,0,0,.3)); }

/* 低电量：发抖 */
@keyframes badiShiver {
  0%, 100% { transform: translateX(-50%) rotate(0deg); }
  25% { transform: translateX(-49%) rotate(-1.5deg); }
  75% { transform: translateX(-51%) rotate(1.5deg); }
}
.badi.low-battery { animation: badiShiver 0.3s ease-in-out infinite; }

/* 滚向图标 */
.badi.rolling {
  transition: all 1.2s cubic-bezier(.25,.46,.45,.94);
}

/* 巴迪弹跳 */
@keyframes badiBounce {
  0%, 100% { transform: translateX(-50%); }
  30% { transform: translateX(-50%) translateY(-8px); }
  50% { transform: translateX(-50%); }
  70% { transform: translateX(-50%) translateY(-4px); }
}
.badi.bouncing { animation: badiBounce 1.8s ease-in-out infinite; }

/* 巴迪消失（钻进图标） */
.badi.entering {
  opacity: 0;
  transform: translateX(-50%) scale(0.2) translateY(20px);
  transition: all 0.6s ease-in;
}

/* ===== 手机桌面 ===== */
.desk-layer {
  position: fixed; inset: 0; z-index: 3;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s;
}
.desk-layer.show {
  opacity: 1;
  pointer-events: auto;
}

/* 手机桌面模拟（中间一个手机框） */
.phone-frame {
  position: absolute;
  top: 8vh; left: 50%;
  transform: translateX(-50%);
  width: 78vw; max-width: 340px;
  height: 72vh;
  background: linear-gradient(180deg, #FFFFFF 0%, #F0F2F5 100%);
  border-radius: 28px;
  border: 3px solid #D0D4DA;
  box-shadow: 0 20px 60px rgba(0,0,0,.15);
  padding: 24px 16px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* 手机状态栏 */
.phone-status {
  width: 100%;
  display: flex; justify-content: space-between;
  padding: 0 8px 12px;
  font-size: 11px; color: #999;
  font-weight: 600;
}

/* APP 图标网格 */
.app-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px 14px;
  justify-items: center;
  padding-top: 16px;
}

.app-icon {
  width: 58px; height: 58px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  opacity: 0.6;
  transition: opacity 0.5s;
}

.app-icon.show { opacity: 1; }

.app-icon svg { width: 34px; height: 34px; }

.app-label {
  font-size: 10px; color: #555;
  margin-top: 4px; text-align: center;
  font-weight: 500;
}

.app-wrap {
  display: flex; flex-direction: column;
  align-items: center;
}

/* 沃克巴迪图标（发光跳动） */
.badi-app {
  width: 66px; height: 66px;
  border-radius: 16px;
  background: linear-gradient(135deg, #4A90E2, #7BB5F2);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  box-shadow: 0 0 0 0 rgba(74,144,226,.5);
  animation: badiAppGlow 1.8s ease-in-out infinite, badiAppBounce 1.8s ease-in-out infinite;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

@keyframes badiAppGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(74,144,226,.6), 0 0 20px rgba(74,144,226,.4); }
  50% { box-shadow: 0 0 0 14px rgba(74,144,226,0), 0 0 30px rgba(74,144,226,.6); }
}

@keyframes badiAppBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.badi-app svg { width: 42px; height: 42px; }

.badi-app.entering {
  animation: badiAppGrow 0.6s ease-out forwards;
}

@keyframes badiAppGrow {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); box-shadow: 0 0 40px rgba(74,144,226,.8); }
  100% { transform: scale(8); box-shadow: 0 0 80px rgba(255,255,255,1); opacity: 0; }
}

/* 光圈（巴迪钻进去后） */
.light-ring {
  position: fixed; z-index: 25;
  top: 32vh; left: 50%;
  transform: translateX(-50%) scale(0);
  width: 120px; height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(74,144,226,.6) 40%, transparent 70%);
  opacity: 0;
  pointer-events: none;
}

.light-ring.active {
  animation: ringExpand 1s ease-out forwards;
}

@keyframes ringExpand {
  0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
  30% { opacity: 1; }
  100% { transform: translateX(-50%) scale(4); opacity: 0; }
}

/* ===== 手指引导 ===== */
.finger-hint {
  position: fixed; z-index: 30;
  top: 30vh; left: 50%;
  transform: translateX(-50%);
  font-size: 36px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s;
}

.finger-hint.show {
  opacity: 1;
  animation: fingerPoint 1.2s ease-in-out infinite;
}

@keyframes fingerPoint {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(12px); }
}

/* ===== 巴迪大脸特写 ===== */
.badi-face {
  position: fixed; z-index: 28;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  opacity: 0;
  transition: all 0.8s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none;
}

.badi-face.show {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

.badi-face svg { width: 200px; height: 200px; filter: drop-shadow(0 12px 30px rgba(0,0,0,.25)); }

/* 大脸开心弹跳 */
@keyframes faceHappy {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  30% { transform: translate(-50%, -52%) scale(1.06); }
  50% { transform: translate(-50%, -50%) scale(1); }
  70% { transform: translate(-50%, -51%) scale(1.03); }
}
.badi-face.show.happy { animation: faceHappy 1.6s ease-in-out infinite; }

/* ===== 对话气泡 ===== */
.bubble-container {
  position: fixed; z-index: 35;
  left: 50%; transform: translateX(-50%);
  top: 12vh;
  display: flex; flex-direction: column;
  align-items: center; gap: 10px;
  opacity: 0;
  transition: opacity 0.6s;
  width: 90vw; max-width: 340px;
}

.bubble-container.visible { opacity: 1; }
.bubble-container.bottom { top: auto; bottom: 14vh; }

.speech-bubble {
  background: white;
  border-radius: 24px;
  padding: 18px 26px;
  max-width: 300px;
  text-align: center;
  font-size: 18px;
  font-weight: 500;
  line-height: 1.7;
  color: var(--ink);
  box-shadow: 0 8px 30px rgba(0,0,0,.15);
  position: relative;
  border: 3px solid var(--blue-l);
}

.speech-bubble.dark-bg {
  background: rgba(255,255,255,.95);
}

.speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -14px;
  left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-top: 14px solid white;
}

.cursor-blink {
  display: inline-block;
  width: 2px; height: 20px;
  background: var(--blue);
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: blink 0.7s step-end infinite;
}

@keyframes blink { 50% { opacity: 0; } }

/* ===== 小重播按钮 ===== */
.inline-replay {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,.9);
  border: 2px solid var(--blue);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  opacity: 0;
  transform: scale(0);
  transition: all 0.4s cubic-bezier(.34,1.56,.64,1);
}
.inline-replay.show { opacity: 1; transform: scale(1); }
.inline-replay:active { transform: scale(.85); }

/* ===== 底部小字（云朵城堡） ===== */
.secret-text {
  position: fixed; z-index: 30;
  bottom: 9vh; left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  color: rgba(74,144,226,.5);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  opacity: 0;
  transition: opacity 0.8s;
  text-decoration: underline;
  text-decoration-style: dotted;
}

.secret-text.show { opacity: 1; }
.secret-text:active { color: rgba(74,144,226,.9); }

/* ===== 场景标题 ===== */
.scene-title {
  position: fixed; z-index: 30;
  top: 4vh; left: 50%; transform: translateX(-50%);
  font-size: 13px; font-weight: 600;
  color: rgba(255,255,255,.6);
  letter-spacing: 2px;
  opacity: 0;
  transition: opacity 1s;
}
.scene-title.visible { opacity: 1; }
.scene-title.dark { color: rgba(100,100,100,.5); }

/* ===== 底部导航 ===== */
.nav-bar {
  position: fixed; z-index: 40;
  bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px;
  opacity: 0;
  transition: opacity 0.6s;
}
.nav-bar.visible { opacity: 1; }

.nav-btn {
  font-family: inherit;
  font-size: 15px; font-weight: 600;
  padding: 12px 20px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .15s;
}
.nav-btn:active { transform: scale(.95); }

.nav-btn.replay {
  background: rgba(255,255,255,.9);
  color: var(--blue);
  border: 2px solid var(--blue);
}

.nav-btn.next {
  background: var(--blue);
  color: white;
  box-shadow: 0 4px 14px rgba(74,144,226,.4);
}

.nav-btn.prelude {
  background: rgba(255,255,255,.15);
  color: rgba(255,255,255,.8);
  border: 1px solid rgba(255,255,255,.3);
}

/* ===== 欢迎遮罩 ===== */
.welcome {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(180deg, #2A1A3E 0%, #4A2A4E 50%, #6A3A4E 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer;
  transition: opacity 0.6s;
}
.welcome.hide { opacity: 0; pointer-events: none; }

.welcome-bot {
  width: 100px; height: 100px;
  animation: welcomeBounce 2s ease-in-out infinite;
}
@keyframes welcomeBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-16px); }
}

.welcome-title {
  color: white;
  font-size: 28px; font-weight: 800;
  margin: 20px 0 10px;
  text-align: center;
}

.welcome-sub {
  color: rgba(255,255,255,.6);
  font-size: 15px;
  text-align: center;
  line-height: 1.8;
  margin-bottom: 28px;
}

.welcome-btn {
  font-family: inherit;
  font-size: 18px; font-weight: 700;
  background: var(--blue);
  color: white;
  border: none;
  border-radius: 999px;
  padding: 16px 40px;
  box-shadow: 0 6px 24px rgba(74,144,226,.5);
  animation: btnPulse 2s ease-in-out infinite;
}
@keyframes btnPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

/* ===== 音乐控制 ===== */
.music-fab {
  position: fixed; right: 16px; bottom: 16px; z-index: 50;
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,.2);
  border: 1px solid rgba(255,255,255,.3);
  color: white;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.5s, background .3s;
  -webkit-tap-highlight-color: transparent;
}
.music-fab.visible { opacity: 1; }
.music-fab.playing { background: rgba(74,144,226,.4); border-color: rgba(74,144,226,.5); }
.music-fab:active { transform: scale(.9); }

/* ===== 下一集提示弹窗 ===== */
.toast {
  position: fixed; z-index: 60;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(0,0,0,.8);
  color: white;
  padding: 20px 32px;
  border-radius: 20px;
  font-size: 17px;
  font-weight: 500;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}
</style>
</head>
<body>

<!-- 欢迎遮罩 -->
<div class="welcome" id="welcome">
  <svg class="welcome-bot" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
    <circle cx="80" cy="72" r="60" fill="rgba(74,144,226,.15)"/>
    <line x1="80" y1="16" x2="80" y2="32" stroke="#4A90E2" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="12" r="6" fill="#F5A623"/>
    <rect x="30" y="32" width="100" height="76" rx="28" fill="#4A90E2"/>
    <ellipse cx="60" cy="62" rx="12" ry="13" fill="white"/>
    <ellipse cx="100" cy="62" rx="12" ry="13" fill="white"/>
    <circle cx="62" cy="64" r="7" fill="#1A5AA8"/>
    <circle cx="102" cy="64" r="7" fill="#1A5AA8"/>
    <circle cx="64" cy="60" r="3" fill="#F5A623"/>

    <path d="M66 84 Q80 98 94 84" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>

  </svg>
  <div class="welcome-title">魔法充电</div>
  <div class="welcome-sub">沃克巴迪的故事 · 第2集<br>天黑了，巴迪的肚子咕咕叫……</div>

</div>

<!-- 场景背景 -->
<div class="scene-bg dusk" id="sceneBg"></div>

<!-- 星星层 -->
<div class="stars-layer" id="starsLayer"></div>

<!-- 草地 -->
<div class="ground-layer" id="groundLayer">
  <div class="grass-top"></div>
</div>

<!-- 手机桌面 -->
<div class="desk-layer" id="deskLayer">
  <div class="phone-frame">
    <div class="phone-status">
      <span>9:30</span>
      <span>🔋 100%</span>
    </div>
    <div class="app-grid">
      <!-- 相机 -->
      <div class="app-wrap">
        <div class="app-icon show" style="background:linear-gradient(135deg,#FF9500,#FF7A00);border-radius:14px;">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="12" width="28" height="20" rx="3" fill="white"/>
            <circle cx="20" cy="22" r="7" fill="#FF7A00"/>
            <circle cx="20" cy="22" r="4" fill="white"/>
            <rect x="14" y="8" width="10" height="6" rx="2" fill="white"/>
          </svg>
        </div>
        <div class="app-label">相机</div>
      </div>
      <!-- 日历 -->
      <div class="app-wrap">
        <div class="app-icon show" style="background:linear-gradient(135deg,#FF3B30,#FF6359);border-radius:14px;">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="10" width="24" height="22" rx="2" fill="white"/>

            <text x="20" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="#FF3B30" font-family="sans-serif">27</text>
          </svg>
        </div>
        <div class="app-label">日历</div>
      </div>
      <!-- 音乐 -->
      <div class="app-wrap">
        <div class="app-icon show" style="background:linear-gradient(135deg,#FF2D55,#FF6B8A);border-radius:14px;">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 10 L28 8 L28 26 Q28 30 24 30 Q20 30 20 26 Q20 22 24 22 Q26 22 26 23 L26 12 L16 14 L16 28 Q16 32 12 32 Q8 32 8 28 Q8 24 12 24 Q14 24 14 25 Z" fill="white"/>
          </svg>
        </div>
        <div class="app-label">音乐</div>
      </div>
      <!-- 沃克巴迪图标（发光跳动） -->
      <div class="app-wrap" style="grid-column: 2;">
        <div class="badi-app" id="badiApp">
          <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">

            <ellipse cx="38" cy="24" rx="4" ry="5" fill="#1A5AA8"/>

            <rect x="20" y="42" width="20" height="10" rx="4" fill="#1A5AA8"/>

        <div class="app-label" style="color:#4A90E2;font-weight:600;">沃克巴迪</div>
      </div>
    </div>
  </div>
</div>

<!-- 巴迪（饥饿状态） -->
<div class="badi low-battery" id="badi">
  <svg viewBox="0 0 160 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bodyGrad2" cx="50%" cy="40%">
        <stop offset="0%" stop-color="#7BB5F2"/>
        <stop offset="100%" stop-color="#2A6AB8"/>
      </radialGradient>
      <radialGradient id="headGrad2" cx="50%" cy="35%">
        <stop offset="0%" stop-color="#6CADEE"/>
        <stop offset="100%" stop-color="#1A5AA8"/>
      </radialGradient>
      <filter id="glow2">
        <feGaussianBlur stdDeviation="2" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

<script>
(function() {
  "use strict";

  // ========== 星星生成 ==========
  var starsLayer = document.getElementById('starsLayer');
  for (var i = 0; i < 80; i++) {
    var star = document.createElement('div');
    star.className = 'star';
    var size = Math.random() * 2.5 + 0.8;
    star.style.cssText = [
      'left:' + (Math.random() * 100) + '%',
      'top:' + (Math.random() * 65) + '%',
      'width:' + size + 'px',
      'height:' + size + 'px',
      '--dur:' + (Math.random() * 3 + 2) + 's',
      '--delay:' + (Math.random() * 4) + 's'
    ].join(';');
    starsLayer.appendChild(star);
  }

  // ========== DOM 引用 ==========
  var welcome = document.getElementById('welcome');
  var sceneBg = document.getElementById('sceneBg');
  var groundLayer = document.getElementById('groundLayer');
  var deskLayer = document.getElementById('deskLayer');
  var badi = document.getElementById('badi');
  var badiFace = document.getElementById('badiFace');
  var badiApp = document.getElementById('badiApp');
  var lightRing = document.getElementById('lightRing');
  var fingerHint = document.getElementById('fingerHint');
  var bubbles = document.getElementById('bubbles');
  var bubbleText = document.getElementById('bubbleText');
  var speechBubble = document.getElementById('speechBubble');
  var secretText = document.getElementById('secretText');
  var sceneTitle = document.getElementById('sceneTitle');
  var navBar = document.getElementById('navBar');
  var musicFab = document.getElementById('musicFab');
  var musicBtn = document.getElementById('musicBtn');
  var replayBtn = document.getElementById('replayBtn');
  var nextBtn = document.getElementById('nextBtn');
  var inlineReplay = document.getElementById('inlineReplay');
  var toast = document.getElementById('toast');

  // ========== 音频引擎 ==========
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var ctx = null, masterGain = null;

  function getCtx() {
    if (!ctx) {
      ctx = new AudioCtx();
      masterGain = ctx.createGain();
      masterGain.gain.value = 0.5;
      masterGain.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // 低电量提示音（嘀嘀…嘀嘀…）
  function playLowBatteryBeep() {
    var ac = getCtx();
    var now = ac.currentTime;
    [0, 0.15].forEach(function(offset) {
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = 'square';
      osc.frequency.value = 880;
      var t = now + offset;
      gain.gain.setValueAtTime(0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(t);
      osc.stop(t + 0.12);
    });
  }

  var lowBatteryInterval = null;
  function startLowBatteryLoop() {
    stopLowBatteryLoop();
    playLowBatteryBeep();
    lowBatteryInterval = setInterval(function() {
      playLowBatteryBeep();
    }, 2000);
  }
  function stopLowBatteryLoop() {
    if (lowBatteryInterval) {
      clearInterval(lowBatteryInterval);
      lowBatteryInterval = null;
    }
  }

  // 开门咔哒声
  function playDoorOpen() {
    var ac = getCtx();
    var now = ac.currentTime;
    // 咔哒：高频脉冲
    var osc1 = ac.createOscillator();
    var gain1 = ac.createGain();
    osc1.type = 'square';
    osc1.frequency.setValueAtTime(1200, now);
    osc1.frequency.exponentialRampToValueAtTime(400, now + 0.05);
    gain1.gain.setValueAtTime(0.2, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    osc1.connect(gain1);
    gain1.connect(masterGain);
    osc1.start(now);
    osc1.stop(now + 0.1);

    // 嗡嗡：低频开门声
    var osc2 = ac.createOscillator();
    var gain2 = ac.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(200, now + 0.08);
    osc2.frequency.linearRampToValueAtTime(400, now + 0.3);
    gain2.gain.setValueAtTime(0.001, now + 0.08);
    gain2.gain.linearRampToValueAtTime(0.12, now + 0.12);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc2.connect(gain2);
    gain2.connect(masterGain);
    osc2.start(now + 0.08);
    osc2.stop(now + 0.45);
  }

  // 充满电的"叮"声
  function playChargeUp() {
    var ac = getCtx();
    var now = ac.currentTime;
    var freqs = [523, 659, 784, 1047]; // C5 E5 G5 C6
    freqs.forEach(function(freq, i) {
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      var t = now + i * 0.1;
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.linearRampToValueAtTime(0.15, t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(t);
      osc.stop(t + 0.45);
    });
  }

  // 嘀嘟音效（复用）
  function playBeepBoop() {
    var ac = getCtx();
    var now = ac.currentTime;
    [660, 880, 660, 520].forEach(function(freq, i) {
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      var t = now + i * 0.12;
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(t);
      osc.stop(t + 0.15);
    });
  }

  // ========== 斯卡布罗集市序曲 ==========
  var N = {
    A2:110.00, B2:123.47, C3:130.81, D3:146.83, E3:164.81, Fs3:185.00, G3:196.00,
    A3:220.00, B3:246.94, C4:261.63, D4:293.66, E4:329.63, Fs4:369.99, G4:392.00,
    A4:440.00, B4:493.88, C5:523.25, D5:587.33, E5:659.25, R:0,
    D2:73.42, G2:98.00
  };
  var BEAT = 0.82;
  var melody = [
    ["E4",1],["A4",1],["C5",1],["B4",0.5],["A4",1],["G4",1],["E4",1],["D4",0.5],["E4",2],["R",0.5],
    ["E4",1],["A4",1],["C5",1],["B4",0.5],["A4",1],["G4",1],["E4",1],["D4",0.5],["E4",2],["R",0.5],
    ["E4",1],["A4",1],["C5",1],["D5",1],["E5",1],["D5",1],["C5",1],["B4",1],["A4",1],["G4",0.5],["E4",2.5],["R",0.5],
    ["D4",1],["E4",1],["G4",1],["A4",1],["G4",0.5],["E4",1],["D4",0.5],["E4",3]
  ];
  var bass = [
    ["A2",3],["G2",3],["A2",3],["A2",3],["G2",3],["A2",3],
    ["A2",3],["D2",3],["A2",3],["G2",3],["D2",3],["A2",3],["A2",3]
  ];

  var reverbGain = null;
  var preludeTimer = null;
  var preludePlaying = false;

  function hornSynth(freq, start, dur, vol) {
    if (freq === 0) return;
    var osc1 = ctx.createOscillator(), osc2 = ctx.createOscillator();
    var filter = ctx.createBiquadFilter(), gain = ctx.createGain();
    var lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
    osc1.type = 'sawtooth'; osc1.frequency.value = freq;
    osc2.type = 'sawtooth'; osc2.frequency.value = freq * 1.006;
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(freq * 2, start);
    filter.frequency.linearRampToValueAtTime(freq * 3.5, start + 0.15);
    filter.frequency.linearRampToValueAtTime(freq * 2.5, start + dur);
    filter.Q.value = 1.5;
    lfo.frequency.value = 4.5;
    lfoGain.gain.setValueAtTime(0, start);
    lfoGain.gain.linearRampToValueAtTime(freq * 0.004, start + 0.3);
    lfo.connect(lfoGain); lfoGain.connect(osc1.frequency); lfoGain.connect(osc2.frequency);
    osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(reverbGain);
    var v = vol || 0.14;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(v, start + 0.1);
    gain.gain.linearRampToValueAtTime(v * 0.85, start + 0.35);
    gain.gain.setValueAtTime(v * 0.85, start + dur - 0.2);
    gain.gain.linearRampToValueAtTime(0.0008, start + dur);
    osc1.start(start); osc1.stop(start + dur + 0.05);
    osc2.start(start); osc2.stop(start + dur + 0.05);
    lfo.start(start); lfo.stop(start + dur + 0.05);
  }

  function bassSynth(freq, start, dur) {
    if (freq === 0) return;
    var osc = ctx.createOscillator(), osc2 = ctx.createOscillator();
    var filter = ctx.createBiquadFilter(), gain = ctx.createGain();
    osc.type = 'sawtooth'; osc.frequency.value = freq;
    osc2.type = 'triangle'; osc2.frequency.value = freq;
    filter.type = 'lowpass'; filter.frequency.value = freq * 2.2; filter.Q.value = 1;
    osc.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(masterGain);
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.09, start + 0.15);
    gain.gain.linearRampToValueAtTime(0.06, start + 0.4);
    gain.gain.setValueAtTime(0.06, start + dur - 0.25);
    gain.gain.linearRampToValueAtTime(0.0008, start + dur);
    osc.start(start); osc.stop(start + dur + 0.05);
    osc2.start(start); osc2.stop(start + dur + 0.05);
  }

  function playPrelude() {
    getCtx();
    if (!reverbGain) {
      var delay = ctx.createDelay(1.0);
      delay.delayTime.value = 0.28;
      var fb = ctx.createGain(); fb.gain.value = 0.35;
      var wet = ctx.createGain(); wet.gain.value = 0.3;
      delay.connect(fb); fb.connect(delay);
      delay.connect(wet); wet.connect(masterGain);
      reverbGain = ctx.createGain(); reverbGain.gain.value = 1;
      reverbGain.connect(delay); reverbGain.connect(masterGain);
    }
    masterGain.gain.setValueAtTime(0.07, ctx.currentTime);
    stopPrelude();
    var t0 = ctx.currentTime + 0.15, t = t0;
    melody.forEach(function(n) {
      var d = n[1] * BEAT;
      hornSynth(N[n[0]], t, d * 0.95, 0.08);
      t += d;
    });
    var bt = t0;
    bass.forEach(function(b) {
      var d = b[1] * BEAT;
      bassSynth(N[b[0]], bt, d * 0.9);
      bt += d;
    });
    preludePlaying = true;
    preludeTimer = setTimeout(function() {
      if (preludePlaying) playPrelude();
    }, (t - t0 + 1.5) * 1000);
  }

  function stopPrelude() {
    preludePlaying = false;
    if (preludeTimer) { clearTimeout(preludeTimer); preludeTimer = null; }
  }

  function togglePrelude() {
    if (preludePlaying) {
      stopPrelude();
      musicFab.classList.remove('playing');
      musicFab.textContent = '🎺';
    } else {
      playPrelude();
      musicFab.classList.add('playing');
      musicFab.textContent = '🔇';
    }
  }

  // ========== 巴迪状态切换 ==========
  function setBadiState(state) {
    var sleepyEyes = document.getElementById('sleepyEyes');
    var normalEyes = document.getElementById('normalEyes');
    var happyEyes = document.getElementById('happyEyes');
    var lowBatteryIcon = document.getElementById('lowBatteryIcon');
    var normalFace = document.getElementById('normalFace');
    var bellyScreen = document.getElementById('bellyScreen2');
    var mouth = document.getElementById('mouth');
    var antennaBall = document.getElementById('antennaBall');

    sleepyEyes.style.display = 'none';
    normalEyes.style.display = 'none';
    happyEyes.style.display = 'none';
    lowBatteryIcon.style.display = 'none';
    normalFace.style.display = 'none';

    if (state === 'low') {
      sleepyEyes.style.display = '';
      lowBatteryIcon.style.display = '';
      bellyScreen.setAttribute('fill', '#3A3A3A');
      bellyScreen.setAttribute('stroke', '#555');
      mouth.setAttribute('d', 'M66 72 Q80 66 94 72');
      antennaBall.setAttribute('fill', '#8A7A5A');
      badi.classList.add('low-battery');
    } else if (state === 'normal') {
      normalEyes.style.display = '';
      normalFace.style.display = '';
      bellyScreen.setAttribute('fill', 'rgba(255,255,255,.95)');
      bellyScreen.setAttribute('stroke', '#4A90E2');
      mouth.setAttribute('d', 'M66 62 Q80 74 94 62');
      antennaBall.setAttribute('fill', '#F5A623');
      badi.classList.remove('low-battery');
    } else if (state === 'happy') {
      happyEyes.style.display = '';
      normalFace.style.display = '';
      bellyScreen.setAttribute('fill', 'rgba(255,255,255,.95)');
      bellyScreen.setAttribute('stroke', '#4CD964');
      mouth.setAttribute('d', 'M62 64 Q80 82 98 64 Q80 74 62 64 Z');
      mouth.setAttribute('fill', 'white');
      antennaBall.setAttribute('fill', '#F5A623');
      badi.classList.remove('low-battery');
    }
  }

  // ========== 对话系统 ==========
  var dialogIdx = 0;
  var dialogs = [];
  var typing = false;
  var afterDialogCallback = null;

  function typeText(text, callback) {
    typing = true;
    bubbleText.innerHTML = '<span id="bubbleTextInner"></span><span class="cursor-blink"></span>';
    var inner = document.getElementById('bubbleTextInner');
    var i = 0;
    var timer = setInterval(function() {
      if (i < text.length) {
        inner.textContent += text[i];
        i++;
      } else {
        clearInterval(timer);
        typing = false;
        if (callback) callback();
      }
    }, 85);
  }

  function showDialog() {
    bubbles.classList.add('visible');
    if (dialogIdx < dialogs.length) {
      typeText(dialogs[dialogIdx], function() {
        dialogIdx++;
        if (dialogIdx < dialogs.length) {
          setTimeout(showDialog, 2000);
        } else {
          setTimeout(function() {
            if (afterDialogCallback) afterDialogCallback();
          }, 2000);
        }
      });
    }
  }

  function showSingleDialog(text, callback) {
    bubbles.classList.remove('visible');
    setTimeout(function() {
      bubbles.classList.add('visible');
      typeText(text, callback);
    }, 200);
  }

  // ========== 场景控制器 ==========
  var phase = 0; // 0=未开始, 1=饥饿, 2=寻找家, 3=进门, 4=充满电

  function startStory() {
    // 重置
    phase = 0;
    badiFace.classList.remove('show', 'happy');
    badiApp.classList.remove('entering');
    lightRing.classList.remove('active');
    deskLayer.classList.remove('show');
    groundLayer.classList.remove('hide');
    starsLayer.classList.remove('show');
    fingerHint.classList.remove('show');
    secretText.classList.remove('show');
    bubbles.classList.remove('visible', 'bottom');
    inlineReplay.classList.remove('show');
    navBar.classList.remove('visible');
    musicFab.classList.remove('visible');
    sceneTitle.classList.remove('visible', 'dark');
    badi.style.opacity = '1';
    badi.style.left = '50%';
    badi.style.bottom = '18vh';
    badi.style.transform = 'translateX(-50%)';
    badi.classList.remove('rolling', 'entering', 'bouncing');
    speechBubble.classList.remove('dark-bg');

    setBadiState('low');
    sceneBg.className = 'scene-bg dusk';

    // 0.5s后场景标题
    setTimeout(function() { sceneTitle.classList.add('visible'); }, 500);

    // 1.5s后开始低电量音效 + 巴迪出现
    setTimeout(function() {
      startLowBatteryLoop();
      phase = 1;
      // 显示第一句旁白
      dialogs = [
        '天慢慢黑了……',
        '巴迪的肚子咕咕叫了起来。'
      ];
      dialogIdx = 0;
      afterDialogCallback = function() {
        // 显示互动提示
        showSingleDialog('点一下巴迪，看看它怎么了？', function() {
          fingerHint.style.top = '50vh';
          fingerHint.classList.add('show');
        });
      };
      showDialog();
    }, 1500);

    // 3s后序曲淡入
    setTimeout(function() {
      playPrelude();
      musicFab.classList.add('visible', 'playing');
      musicFab.textContent = '🔇';
      navBar.classList.add('visible');
    }, 2500);
  }

  // 点击巴迪（饥饿状态）
  badi.addEventListener('click', function(e) {
    e.stopPropagation();
    if (phase !== 1) return;
    fingerHint.classList.remove('show');
    playLowBatteryBeep();

    // 巴迪摇头
    badi.style.transition = 'transform 0.3s';
    badi.style.transform = 'translateX(-50%) rotate(-8deg)';
    setTimeout(function() {
      badi.style.transform = 'translateX(-50%) rotate(8deg)';
    }, 300);
    setTimeout(function() {
      badi.style.transform = 'translateX(-50%) rotate(-5deg)';
    }, 600);
    setTimeout(function() {
      badi.style.transform = 'translateX(-50%)';
      badi.style.transition = '';
    }, 900);

    showSingleDialog('我饿了，走不动了……', function() {
      // 2秒后进入寻找家阶段
      setTimeout(enterFindHome, 2000);
    });
  });

  // 进入"寻找家"阶段
  function enterFindHome() {
    phase = 2;
    stopLowBatteryLoop();

    // 背景渐变到入夜
    sceneBg.classList.remove('dusk');
    sceneBg.classList.add('night');
    starsLayer.classList.add('show');

    // 旁白
    showSingleDialog('别担心！我们帮巴迪找它的家。', function() {
      // 1.5s后草地消失，手机桌面出现
      setTimeout(function() {
        groundLayer.classList.add('hide');
        sceneBg.classList.remove('night');
        sceneBg.classList.add('desk');
        starsLayer.classList.remove('show');
        sceneTitle.classList.add('dark');

        // 巴迪移到旁边缩小
        badi.classList.add('rolling');
        badi.style.left = '20%';
        badi.style.bottom = '4vh';
        badi.style.transform = 'translateX(-50%) scale(0.5)';
        badi.classList.remove('rolling');

        // 手机桌面出现
        setTimeout(function() {
          deskLayer.classList.add('show');
          // 旁白
          setTimeout(function() {
            showSingleDialog('看，那里就是巴迪的家！', function() {
              // 手指指向巴迪图标
              setTimeout(function() {
                fingerHint.style.top = '30vh';
                fingerHint.classList.add('show');
                // 巴迪图标旁白
                setTimeout(function() {
                  bubbles.classList.remove('visible');
                  setTimeout(function() {
                    bubbles.classList.add('visible', 'bottom');
                    speechBubble.classList.add('dark-bg');
                    typeText('那个发光的图标，就是巴迪的家门哦~ 点点它！', null);
                  }, 200);
                }, 1500);
              }, 500);
            });
          }, 800);
        }, 1000);

      }, 1500);
    });
  }

  // 点击巴迪图标（进门）
  badiApp.addEventListener('click', function(e) {
    e.stopPropagation();
    if (phase !== 2) return;
    phase = 3;
    fingerHint.classList.remove('show');
    bubbles.classList.remove('visible');

    // 开门音效
    playDoorOpen();

    // 图标变大
    badiApp.classList.add('entering');

    // 巴迪滚向图标
    badi.classList.add('rolling');
    badi.style.left = '50%';
    badi.style.bottom = '32vh';
    badi.style.transform = 'translateX(-50%) scale(0.6)';

    // 0.6s后巴迪钻进图标
    setTimeout(function() {
      badi.classList.add('entering');
      // 光圈扩散
      lightRing.classList.add('active');
    }, 600);

    // 1.2s后大脸出现
    setTimeout(function() {
      badi.style.opacity = '0';
      badiApp.style.opacity = '0';
      playChargeUp();
      badiFace.classList.add('show', 'happy');
    }, 1200);

    // 2s后显示知识点对话
    setTimeout(function() {
      speechBubble.classList.add('dark-bg');
      bubbles.classList.remove('bottom');
      bubbles.style.top = '68vh';
      dialogs = [
        '哇！充满电啦！',
        '巴迪是机器，机器要吃饭——',
        '它吃的饭叫电！',
        '只要你需要我，',
        '点开这个图标，',
        '我随时都在家等你哦！'
      ];
      dialogIdx = 0;
      afterDialogCallback = function() {
        // 显示底部小字 + 重播 + 下一集
        setTimeout(function() {
          secretText.classList.add('show');
          inlineReplay.classList.add('show');
        }, 1000);
      };
      showDialog();
    }, 2000);
  });

  // 底部小字（云朵城堡）点击
  secretText.addEventListener('click', function() {
    showSingleDialog('嘘，这是秘密基地~', null);
  });

  // ========== 重播 ==========
  function replay() {
    bubbles.style.top = '';
    speechBubble.classList.remove('dark-bg');
    badi.style.opacity = '1';
    badiApp.style.opacity = '1';
    badi.classList.remove('entering', 'rolling');
    startStory();
  }

  replayBtn.addEventListener('click', replay);
  inlineReplay.addEventListener('click', function(e) {
    e.stopPropagation();
    replay();
  });

  // ========== 下一集按钮 ==========
  nextBtn.addEventListener('click', function() {
    toast.classList.add('show');
    setTimeout(function() {
      toast.classList.remove('show');
    }, 2500);
  });

  // 音乐开关
  musicBtn.addEventListener('click', togglePrelude);
  musicFab.addEventListener('click', togglePrelude);

  // ========== 欢迎遮罩 ==========
  welcome.addEventListener('click', function() {
    getCtx();
    welcome.classList.add('hide');
    startStory();
  });

})();
</script>
</body>
</html>
