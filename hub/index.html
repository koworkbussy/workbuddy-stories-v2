<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>沃克巴迪总控台</title>
<style>
  :root{
    --blue:#4A90E2;--blue-dark:#185FA5;--ink:#16202b;--muted:#63707f;
    --bg:#f4f7fb;--card:#fff;--line:#e4eaf2;--green:#047857;--amber:#b45309;--gray:#6b7280;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;padding:16px 14px 48px}
  .wrap{max-width:880px;margin:0 auto}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:.5px}
  .sub{font-size:12px;color:var(--muted)}
  .status{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0 4px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center}
  .stat b{display:block;font-size:17px;color:var(--blue-dark)}
  .stat span{font-size:10.5px;color:var(--muted)}
  h2{font-size:15px;margin:26px 0 10px;padding-left:10px;border-left:3px solid var(--blue)}
  .grid{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
  .proj{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
  .proj h3{margin:0 0 3px;font-size:14px}
  .proj .meta{font-size:11.5px;color:var(--muted);margin-bottom:9px}
  .links{display:flex;flex-wrap:wrap;gap:6px}
  .links a{display:inline-block;font-size:12px;padding:5px 11px;border-radius:999px;
    background:#eef4fb;color:var(--blue-dark);text-decoration:none;border:1px solid #dbe8f8}
  .links a.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .tag{display:inline-block;font-size:10px;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
  .tag.s-done{background:#d1fae5;color:var(--green)}
  .tag.s-wip{background:#fef3c7;color:var(--amber)}
  .tag.s-wait{background:#ffe4e0;color:#b45309}
  .tag.s-pause{background:#eceae4;color:var(--gray)}
  table{width:100%;border-collapse:collapse;background:var(--card);font-size:12.5px;border-radius:10px;overflow:hidden}
  th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:#eef4fb;font-size:12px;color:var(--blue-dark)}
  tr:last-child td{border-bottom:none}
  ul{padding-left:20px;margin:8px 0;font-size:13px}
  li{margin:5px 0}
  .syncbox{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .dev{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
  .dev:last-child{border-bottom:none}
  .dev .name{font-weight:500}
  .devtask{font-size:11.5px;color:var(--muted);margin-top:2px}
  .dev .time{font-size:11px;color:#9aa5b1;white-space:nowrap}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .dot.working{background:#EF9F27}.dot.online{background:#1D9E75}.dot.idle{background:#B4B2A9}
  .rules{background:#f8fbff;border:1px solid #dbe8f8;border-radius:12px;padding:12px 14px 4px;font-size:12.5px}
  .rules li{margin:6px 0}
  .muted{color:var(--muted)}
  footer{margin-top:28px;text-align:center;font-size:11px;color:#a8b2bd}

  /* 最新进展 */
  .hero{background:linear-gradient(135deg,#4A90E2,#185FA5);color:#fff;border-radius:14px;padding:15px 16px;margin-bottom:10px}
  .hero .lbl{font-size:11.5px;opacity:.85;letter-spacing:.5px}
  .hero .big{font-size:19px;font-weight:600;margin:3px 0 6px}
  .hero .nums{display:flex;gap:14px;font-size:11.5px;opacity:.95;flex-wrap:wrap}
  .hero .nums b{font-size:14px;font-weight:600}
  .hero a.go{display:inline-block;margin-top:10px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);
    color:#fff;text-decoration:none;font-size:12px;padding:5px 13px;border-radius:999px}
  .todo{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
  .todo .row{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
  .todo .row:last-child{border-bottom:none}
  .todo .row b{font-weight:500}
  .todo .next{font-size:11.5px;color:var(--muted)}
  .feed{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px 6px}
  .ev{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed #edf1f7;font-size:12.5px}
  .ev:last-child{border-bottom:none}
  .ev .mk{width:7px;height:7px;border-radius:50%;background:var(--blue);margin-top:7px;flex:0 0 7px}
  .ev .body{flex:1}
  .ev .txt{color:var(--ink)}
  .ev .who{font-size:11px;color:#9aa5b1;margin-top:2px}
  .chip{display:inline-block;font-size:10px;padding:0 7px;border-radius:999px;background:#eef4fb;color:var(--blue-dark);margin-right:5px;vertical-align:1px}
  .more{display:block;width:100%;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:9px;font-size:12px;color:var(--blue-dark);font-family:inherit}
  .rep{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>沃克巴迪总控台</h1>
  <div class="sub" id="subline">一个账号 · 一份真相源 · 一个入口</div>
</header>

<div class="status">
  <div class="stat"><b id="nProjects">—</b><span>项目</span></div>
  <div class="stat"><b id="nLinks">—</b><span>云端入口</span></div>
  <div class="stat"><b id="nReports">—</b><span>日报归档</span></div>
  <div class="stat"><b id="nDevices">—</b><span>在线终端</span></div>
</div>

<h2>最新进展 <span id="syncAge" style="font-size:11px;color:#8894a2;font-weight:400"></span></h2>
<div id="hero" class="hero"><div class="lbl">加载中…</div></div>
<div id="todoCard" class="todo"></div>
<div id="feed" class="feed"></div>

<h2>设备同步</h2>
<div id="syncPanel" class="syncbox"><div class="dev"><div><b>加载中…</b></div></div></div>

<h2>项目与入口</h2>
<div id="projects" class="grid"><div class="proj"><div class="meta">加载中…</div></div></div>

<h2>邮件日报归档 <a id="reportAll" href="#" style="font-size:11px;color:#185FA5;font-weight:400;margin-left:6px;text-decoration:none"></a></h2>
<div id="reports"></div>

<h2>日常机制</h2>
<div id="automations"></div>

<h2>资源分布（同一份清单，所有终端引用）</h2>
<div id="resources"></div>

<h2>整合规则</h2>
<div class="rules"><ul id="rules"></ul></div>

<footer id="footer">WorkBuddy 总控台</footer>
</div>

<script>
(function(){
  var BASE = "https://raw.githubusercontent.com/koworkbussy/workbuddy-stories-v2/main/";
  var RES_URL    = BASE + "hub/data/resources.json";
  var STATE_URL  = BASE + "hub/sync/state.json";
  var PROG_URL   = BASE + "hub/data/progress.json";
  var REP_URL    = BASE + "reports/index.json";
  var $ = function(id){ return document.getElementById(id); };
  var STATE_LABEL = {"已上线":"s-done","进行中":"s-wip","待部署":"s-wait","暂停":"s-pause"};
  var reportShown = 8, reportData = [];

  function ago(iso){
    var t = Date.parse(iso); if(isNaN(t)) return "未知";
    var m = Math.round((Date.now()-t)/60000);
    if(m<1) return "刚刚"; if(m<60) return m+" 分钟前";
    var h=Math.round(m/60); if(h<24) return h+" 小时前";
    return Math.round(h/24)+" 天前";
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function get(url){
    return fetch(url+"?t="+Date.now(),{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status); return r.json();
    });
  }

  /* ---------- 最新进展头部 ---------- */
  function renderHero(rep){
    if(!rep || !rep.latest){ $("hero").innerHTML='<div class="lbl">暂无日报归档</div>'; return; }
    var l = rep.latest;
    $("hero").innerHTML =
      '<div class="lbl">最新邮件日报 · '+esc(l.date)+' · 更新于 '+ago(rep.updatedAt)+'</div>'+
      '<div class="big">待办 '+(l.todo||0)+' 条，会议 '+(l.meeting||0)+' 条</div>'+
      '<div class="nums"><span>FYI <b>'+(l.fyi||0)+'</b></span><span>合计 <b>'+(l.total||0)+'</b> 封</span>'+
      '<span>归档 <b>'+(rep.count||0)+'</b> 期</span></div>'+
      '<a class="go" href="'+esc(l.url)+'" target="_blank" rel="noopener">打开今日日报 ›</a>';
    $("nReports").textContent = rep.count||0;
  }

  function renderTodo(state){
    var items = (state.projects||[]).filter(function(p){ return p.state!=="已完成"; });
    if(!items.length){ $("todoCard").innerHTML='<div class="row"><span class="muted">没有未完成事项</span></div>'; return; }
    $("todoCard").innerHTML = items.map(function(p){
      return '<div class="row"><div><b>'+esc(p.name)+'</b><span class="tag '+(STATE_LABEL[p.state]||"s-pause")+'">'+esc(p.state)+'</span>'+
             '<div class="next">下一步：'+esc(p.next||"—")+'</div></div></div>';
    }).join("");
  }

  function renderFeed(prog){
    var evs = (prog.events||[]).slice(0,8);
    if(!evs.length){ $("feed").innerHTML='<div class="ev"><div class="body muted">暂无进展记录</div></div>'; return; }
    $("feed").innerHTML = evs.map(function(e){
      return '<div class="ev"><div class="mk"></div><div class="body">'+
             '<div class="txt"><span class="chip">'+esc(e.tag||"进展")+'</span>'+esc(e.text)+'</div>'+
             '<div class="who">'+esc(e.device||"")+' · '+ago(e.at)+'</div></div></div>';
    }).join("");
  }

  /* ---------- 设备 ---------- */
  function renderState(s){
    var label={working:"工作中",online:"在线",idle:"空闲"};
    var html="", online=0;
    (s.devices||[]).forEach(function(d){
      if(d.status!=="idle") online++;
      html += '<div class="dev"><div><b class="name"><span class="dot '+(d.status||"idle")+'"></span>'+esc(d.name)+'</b>'+
              '<div class="devtask">'+esc(d.task)+'</div></div>'+
              '<div class="time">'+esc(label[d.status]||d.status||"")+' · '+ago(d.lastSeen)+'</div></div>';
    });
    var pend=(s.requests||[]).filter(function(r){return r.status==="pending";});
    html += '<div class="dev"><div><b class="name">任务信箱</b><div class="devtask">'+
            (pend.length? pend.map(function(r){return esc(r.task);}).join("；") : "暂无待处理任务（手机端可写入 requests）")+
            '</div></div><div class="time">'+(pend.length+" 条待办")+'</div></div>';
    $("syncPanel").innerHTML = html;
    $("nDevices").textContent = online;
    $("syncAge").textContent = "· 数据同步于 "+ago(s.updatedAt)+" · 45 秒自动刷新";
  }

  /* ---------- 日报归档 ---------- */
  function renderReports(rep){
    reportData = rep.reports||[];
    var rows = reportData.slice(0, reportShown).map(function(r){
      return '<tr><td class="rep">'+esc(r.date)+'</td><td class="rep">'+(r.todo||0)+'</td>'+
             '<td class="rep muted">'+(r.meeting||0)+'</td><td class="rep muted">'+(r.fyi||0)+'</td>'+
             '<td class="rep muted">'+(r.total||0)+'</td>'+
             '<td><a href="'+esc(r.url)+'" target="_blank" rel="noopener" style="color:#185FA5;text-decoration:none">打开</a></td></tr>';
    }).join("");
    var more = reportData.length > reportShown
      ? '<button class="more" id="moreBtn">展开全部 '+reportData.length+' 期 ›</button>' : '';
    $("reports").innerHTML = '<table><tr><th>日期</th><th>待办</th><th>会议</th><th>FYI</th><th>合计</th><th></th></tr>'+rows+'</table>'+more;
    var btn = $("moreBtn");
    if(btn){ btn.onclick = function(){ reportShown = reportData.length; renderReports(rep); }; }
    $("reportAll").textContent = "共 "+(rep.count||reportData.length)+" 期";
    $("reportAll").href = "https://github.com/koworkbussy/workbuddy-stories-v2/tree/main/reports";
  }

  /* ---------- 项目 / 机制 / 资源 ---------- */
  function renderRes(r){
    var links=0, html="";
    (r.projects||[]).forEach(function(p){
      links += (p.links||[]).length;
      var a = (p.links||[]).map(function(l){
        return '<a class="'+(l.primary?"primary":"")+'" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>';
      }).join("");
      html += '<div class="proj"><h3>'+esc(p.name)+'<span class="tag '+(STATE_LABEL[p.state]||"s-pause")+'">'+esc(p.state)+'</span></h3>'+
              '<div class="meta">'+esc(p.summary)+'</div><div class="links">'+a+'</div></div>';
    });
    $("projects").innerHTML = html;
    $("nProjects").textContent = (r.projects||[]).length;
    $("nLinks").textContent = links;

    var at = '<table><tr><th style="width:104px">时间</th><th style="width:112px">任务</th><th>说明</th></tr>';
    (r.automations||[]).forEach(function(x){
      at += "<tr><td>"+esc(x.time)+"</td><td>"+esc(x.name)+"</td><td class=\"muted\">"+esc(x.desc)+"</td></tr>";
    });
    $("automations").innerHTML = at+"</table>";

    var rt = '<table><tr><th style="width:104px">资源</th><th>位置</th><th style="width:86px">终端</th><th style="width:112px">云端</th></tr>';
    (r.resources||[]).forEach(function(x){
      rt += "<tr><td>"+esc(x.name)+"</td><td class=\"muted\" style=\"font-size:11.5px\">"+esc(x.where)+"</td><td>"+esc(x.access)+"</td><td class=\"muted\">"+esc(x.cloud)+"</td></tr>";
    });
    $("resources").innerHTML = rt+"</table>";

    var boardLink = (r.identity&&r.identity.boardUrl)
      ? '<li>完整项目看板（Markdown）：<a href="'+esc(r.identity.boardUrl)+'" target="_blank" rel="noopener" style="color:#185FA5;text-decoration:none">在 GitHub 打开</a></li>' : '';
    $("rules").innerHTML = (r.rules||[]).map(function(x){ return "<li>"+esc(x)+"</li>"; }).join("")+boardLink;
    $("subline").innerHTML = '一个账号（'+esc(r.identity.account)+'）· 一份真相源 · 一个入口 · 清单 v'+esc(r.meta.version)+' 更新于 '+esc(r.meta.updatedAt.slice(0,10));
    $("footer").textContent = "数据源：resources.json / state.json / progress.json / reports/index.json · 全部终端同一份";
  }

  function fail(el, msg){
    $(el).innerHTML = '<div class="proj"><div class="meta">读取失败：'+esc(msg)+'</div></div>';
  }

  function loadAll(){
    get(RES_URL).then(renderRes).catch(function(e){ fail("projects","资源清单 "+e.message); });
    get(REP_URL).then(function(rep){ renderHero(rep); renderReports(rep); })
      .catch(function(e){ $("hero").innerHTML='<div class="lbl">日报索引读取失败：'+esc(e.message)+'</div>'; });
    get(PROG_URL).then(renderFeed).catch(function(e){ $("feed").innerHTML='<div class="ev"><div class="body muted">进展时间线读取失败：'+esc(e.message)+'</div></div>'; });
    get(STATE_URL).then(function(s){ renderState(s); renderTodo(s); })
      .catch(function(e){ $("syncPanel").innerHTML='<div class="dev"><div><b class="name">状态读取失败</b><div class="devtask">'+esc(e.message)+'</div></div></div>'; });
  }

  loadAll();
  setInterval(function(){
    get(STATE_URL).then(function(s){ renderState(s); renderTodo(s); }).catch(function(){});
    get(PROG_URL).then(renderFeed).catch(function(){});
  },45000);
})();
</script>
</body>
</html>
